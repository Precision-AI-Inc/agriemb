name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build tooling
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      # Inspect the artifact that is actually being released. Reading the
      # version from `importlib.metadata` in the build checkout would instead
      # pick up the stray `*.egg-info/` that `python -m build` leaves in the
      # working directory, which passes even when `dist/` holds something else.
      - name: Check the built artifacts match the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python - "$TAG_VERSION" <<'PY'
          import sys
          from pathlib import Path

          tag_version = sys.argv[1]
          artifacts = sorted(Path("dist").glob("*"))
          if not artifacts:
              sys.exit("No artifacts were built into dist/")

          expected = {
              f"precisionai_agriemb-{tag_version}-py3-none-any.whl",
              f"precisionai_agriemb-{tag_version}.tar.gz",
          }
          actual = {path.name for path in artifacts}
          if actual != expected:
              sys.exit(f"dist/ holds {sorted(actual)}, expected {sorted(expected)} for tag v{tag_version}")
          print(f"dist/ matches tag v{tag_version}: {sorted(actual)}")
          PY

      # A wheel that installs and imports is the real check that the namespace
      # package was packaged correctly (no `precisionai/__init__.py`).
      - name: Install the wheel and verify it imports
        run: |
          python -m venv /tmp/release-check
          /tmp/release-check/bin/pip install "dist/precisionai_agriemb-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          INSTALLED=$(/tmp/release-check/bin/python -c \
            "import importlib.metadata as m; print(m.version('precisionai-agriemb'))")
          if [ "${GITHUB_REF_NAME#v}" != "$INSTALLED" ]; then
            echo "Tag $GITHUB_REF_NAME does not match installed version $INSTALLED" >&2
            exit 1
          fi
          /tmp/release-check/bin/python -c "import precisionai.agriemb; print(precisionai.agriemb.__all__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Detect pre-release
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ [.]?(dev|a|b|rc)[0-9]+$ ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.value }}
